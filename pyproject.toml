[project]
name = "cloud-run-poc"
version = "0.1.0"
description = "Proof of Concept for Google Cloud Run Service and Job"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "google-cloud-run",
    "supabase>=2.28.3",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
  "*.py",
  "templates"
]
